[package]
name = "billing-memo"
version = "0.3.0"
description = "A small, local developer expense ledger"
authors = ["Jungjae Lee"]
edition = "2021"
license = "MIT"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-opener = "=2.7.1"
tauri-plugin-single-instance = "=2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "=0.17.2"
rusty-leveldb = "=4.0.1"
tempfile = "3"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
